name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show environment
        run: python --version
      - name: Run unit tests (stdlib only, no install needed)
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        shell: bash
        run: |
          python -m pip install build
          python -m build
      - name: Smoke test the CLI
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: |
          python -m lingualint examples --format json > report.json || true
          python -c "import json; d=json.load(open('report.json', encoding='utf-8')); assert d['summary']['files'] == 2; print('smoke ok')"
